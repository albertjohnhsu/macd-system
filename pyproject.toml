[project]
name = "twtrend"
version = "0.1.0"
description = "台股趨勢追蹤系統：L1 大盤狀態機、L2 趨勢評分、L3 安全篩選、L4 部位與出場、實盤監控"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24", "requests>=2.28", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
twtrend = "twtrend.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["twtrend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
